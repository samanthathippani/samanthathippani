<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080710"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulseOnline { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; filter: drop-shadow(0 0 4px #10B981); } }
      .blinking { animation: blinkCursor 1s infinite; }
      .online-pulse { animation: pulseOnline 2s infinite; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="166" rx="10" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.2"/>

  <!-- Top Bar -->
  <path d="M 2 10 Q 2 2 10 2 L 890 2 Q 898 2 898 10 L 898 30 L 2 30 Z" fill="#100F1E"/>
  <line x1="2" y1="30" x2="898" y2="30" stroke="#8B5CF6" stroke-opacity="0.25"/>

  <!-- Window controls -->
  <circle cx="20" cy="16" r="4" fill="#EF4444" opacity="0.8"/>
  <circle cx="34" cy="16" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="48" cy="16" r="4" fill="#10B981" opacity="0.8"/>
  <text x="70" y="20" fill="#94A3B8" font-size="10" class="mono">DEV_OS_TERMINAL // SESSION_TERMINATION</text>

  <!-- Terminal Body -->
  <g transform="translate(24, 52)" class="mono" font-size="11">
    <text x="0" y="0" fill="#38BDF8" font-weight="bold">developer@github:~$</text>
    <text x="140" y="0" fill="#DDD6FE">echo "keep building."</text>
    
    <text x="0" y="24" fill="#F472B6" font-weight="bold">&gt; "keep building."</text>
    <rect x="135" y="13" width="7" height="13" fill="#F472B6" class="blinking"/>
  </g>

  <!-- Divider -->
  <line x1="24" y1="95" x2="876" y2="95" stroke="#8B5CF6" stroke-opacity="0.2"/>

  <!-- Status HUD Row -->
  <g transform="translate(24, 115)" class="mono" font-size="10">
    <!-- SYSTEM STATUS -->
    <text x="0" y="14" fill="#94A3B8">SYSTEM STATUS</text>
    <circle cx="108" cy="11" r="3.5" fill="#10B981" class="online-pulse"/>
    <text x="118" y="14" fill="#34D399" font-weight="bold">ONLINE</text>

    <!-- CONNECTION -->
    <text x="240" y="14" fill="#94A3B8">CONNECTION</text>
    <circle cx="335" cy="11" r="3.5" fill="#38BDF8"/>
    <text x="345" y="14" fill="#38BDF8" font-weight="bold">TLS 1.3 SECURE</text>

    <!-- MODE -->
    <text x="490" y="14" fill="#94A3B8">MODE</text>
    <circle cx="540" cy="11" r="3.5" fill="#F472B6"/>
    <text x="550" y="14" fill="#F472B6" font-weight="bold">AUTONOMOUS / BUILDING</text>

    <!-- HASH -->
    <text x="730" y="14" fill="#64748B">ID // 0xST_2026</text>
  </g>
</svg>

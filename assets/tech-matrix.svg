<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060A"/>
      <stop offset="50%" stop-color="#090912"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141324" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D0D18" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="borderViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#121024" stop-opacity="0.9"/>
    </linearGradient>

    <pattern id="matrixGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#231838" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>

    <filter id="matrixShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes neonPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      .pulsing { animation: neonPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#matrixBg)"/>
  <rect width="900" height="480" fill="url(#matrixGrid)"/>

  <!-- Matrix Header Deck -->
  <g transform="translate(30, 24)">
    <circle cx="8" cy="12" r="4" fill="#38BDF8" class="pulsing"/>
    <text x="22" y="16" fill="#DDD6FE" font-size="14" class="sans" font-weight="800" letter-spacing="1.5">TECH_STACK // ARCHITECTURAL MATRIX</text>
    <text x="22" y="32" fill="#94A3B8" font-size="10" class="mono">RUNTIME ENVIRONMENT • MULTI-DISCIPLINARY SYSTEMS • PRODUCTION VERIFIED</text>
    
    <!-- Status Badge -->
    <rect x="680" y="4" width="160" height="24" rx="4" fill="#1C1430" stroke="#8B5CF6" stroke-width="0.8"/>
    <circle cx="694" cy="16" r="3" fill="#10B981"/>
    <text x="704" y="20" fill="#E2E8F0" font-size="9" class="mono" font-weight="bold">6 CLUSTERS ACTIVE</text>
  </g>

  <!-- Circuit bus line -->
  <line x1="30" y1="65" x2="870" y2="65" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="450" cy="65" r="3" fill="#D946EF"/>

  <!-- ==================== CLUSTER 01: CORE LANGUAGES ==================== -->
  <g transform="translate(30, 80)" filter="url(#matrixShadow)">
    <rect width="405" height="112" rx="8" fill="url(#cardGrad)" stroke="url(#borderViolet)" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 397 0 Q 405 0 405 8 L 405 28 L 0 28 Z" fill="#17142B"/>
    <text x="14" y="18" fill="#F472B6" font-size="9.5" class="mono" font-weight="bold">[01] CORE LANGUAGES</text>
    <text x="315" y="18" fill="#94A3B8" font-size="8.5" class="mono">LEVEL: PROFICIENT</text>

    <!-- Pills -->
    <g transform="translate(14, 38)">
      <!-- Python -->
      <rect x="0" y="0" width="75" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="10" cy="14" r="2.5" fill="#38BDF8"/>
      <text x="20" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Python</text>

      <!-- C -->
      <rect x="85" y="0" width="50" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="95" cy="14" r="2.5" fill="#C084FC"/>
      <text x="105" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">C</text>

      <!-- SQL -->
      <rect x="145" y="0" width="60" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="155" cy="14" r="2.5" fill="#F472B6"/>
      <text x="165" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">SQL</text>

      <!-- JavaScript -->
      <rect x="215" y="0" width="95" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="225" cy="14" r="2.5" fill="#FBBF24"/>
      <text x="235" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">JavaScript</text>

      <!-- HTML5 -->
      <rect x="320" y="0" width="65" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="330" cy="14" r="2.5" fill="#FB923C"/>
      <text x="340" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">HTML5</text>
    </g>

    <text x="14" y="98" fill="#64748B" font-size="8.5" class="mono">APPLICATIONS: Data Science, Scalable Services, Algorithms &amp; Scripts</text>
  </g>

  <!-- ==================== CLUSTER 02: FRONTEND SYSTEMS ==================== -->
  <g transform="translate(465, 80)" filter="url(#matrixShadow)">
    <rect width="405" height="112" rx="8" fill="url(#cardGrad)" stroke="url(#borderCyan)" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 397 0 Q 405 0 405 8 L 405 28 L 0 28 Z" fill="#111B29"/>
    <text x="14" y="18" fill="#38BDF8" font-size="9.5" class="mono" font-weight="bold">[02] CLIENT &amp; FRONTEND ARCHITECTURE</text>
    <text x="300" y="18" fill="#94A3B8" font-size="8.5" class="mono">SPA &amp; PWA HYBRID</text>

    <!-- Pills -->
    <g transform="translate(14, 38)">
      <!-- React.js -->
      <rect x="0" y="0" width="85" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="10" cy="14" r="2.5" fill="#38BDF8"/>
      <text x="20" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">React.js</text>

      <!-- Angular -->
      <rect x="95" y="0" width="85" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="105" cy="14" r="2.5" fill="#EF4444"/>
      <text x="115" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Angular</text>

      <!-- PWA -->
      <rect x="190" y="0" width="95" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="200" cy="14" r="2.5" fill="#A855F7"/>
      <text x="210" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">PWA (Offline)</text>

      <!-- CSS3 -->
      <rect x="295" y="0" width="85" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="305" cy="14" r="2.5" fill="#38BDF8"/>
      <text x="315" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">CSS3 Styling</text>
    </g>

    <text x="14" y="98" fill="#64748B" font-size="8.5" class="mono">CAPABILITIES: Cross-device responsiveness, offline caching, modular SPAs</text>
  </g>

  <!-- ==================== CLUSTER 03: BACKEND & REST APIS ==================== -->
  <g transform="translate(30, 205)" filter="url(#matrixShadow)">
    <rect width="405" height="112" rx="8" fill="url(#cardGrad)" stroke="url(#borderViolet)" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 397 0 Q 405 0 405 8 L 405 28 L 0 28 Z" fill="#17142B"/>
    <text x="14" y="18" fill="#C084FC" font-size="9.5" class="mono" font-weight="bold">[03] BACKEND ENGINES &amp; FRAMEWORKS</text>
    <text x="305" y="18" fill="#94A3B8" font-size="8.5" class="mono">MICROSERVICES</text>

    <!-- Pills -->
    <g transform="translate(14, 38)">
      <!-- Spring Boot -->
      <rect x="0" y="0" width="105" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="10" cy="14" r="2.5" fill="#10B981"/>
      <text x="20" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Spring Boot</text>

      <!-- Flask -->
      <rect x="115" y="0" width="65" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="125" cy="14" r="2.5" fill="#94A3B8"/>
      <text x="135" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Flask</text>

      <!-- Django -->
      <rect x="190" y="0" width="75" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="200" cy="14" r="2.5" fill="#34D399"/>
      <text x="210" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Django</text>

      <!-- REST APIs -->
      <rect x="275" y="0" width="105" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="285" cy="14" r="2.5" fill="#F472B6"/>
      <text x="295" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">RESTful APIs</text>
    </g>

    <text x="14" y="98" fill="#64748B" font-size="8.5" class="mono">SERVICES: Enterprise MVC, lightweight endpoints, automated pipelines</text>
  </g>

  <!-- ==================== CLUSTER 04: CLOUD & DEVOPS INFRA ==================== -->
  <g transform="translate(465, 205)" filter="url(#matrixShadow)">
    <rect width="405" height="112" rx="8" fill="url(#cardGrad)" stroke="url(#borderCyan)" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 397 0 Q 405 0 405 8 L 405 28 L 0 28 Z" fill="#111B29"/>
    <text x="14" y="18" fill="#38BDF8" font-size="9.5" class="mono" font-weight="bold">[04] CLOUD PLATFORMS &amp; DEV TOOLS</text>
    <text x="320" y="18" fill="#94A3B8" font-size="8.5" class="mono">CI/CD &amp; CLOUD</text>

    <!-- Pills -->
    <g transform="translate(14, 38)">
      <!-- AWS -->
      <rect x="0" y="0" width="60" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="10" cy="14" r="2.5" fill="#F59E0B"/>
      <text x="20" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">AWS</text>

      <!-- GCP -->
      <rect x="70" y="0" width="60" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="80" cy="14" r="2.5" fill="#3B82F6"/>
      <text x="90" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">GCP</text>

      <!-- Firebase -->
      <rect x="140" y="0" width="80" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="150" cy="14" r="2.5" fill="#F97316"/>
      <text x="160" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Firebase</text>

      <!-- Git / GitHub -->
      <rect x="230" y="0" width="75" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="240" cy="14" r="2.5" fill="#E2E8F0"/>
      <text x="250" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Git / GH</text>

      <!-- Postman -->
      <rect x="315" y="0" width="70" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="325" cy="14" r="2.5" fill="#F97316"/>
      <text x="335" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Postman</text>
    </g>

    <text x="14" y="98" fill="#64748B" font-size="8.5" class="mono">INFRA: Serverless hosting, real-time sync, automated version control</text>
  </g>

  <!-- ==================== CLUSTER 05: DATABASES & STORAGE ==================== -->
  <g transform="translate(30, 330)" filter="url(#matrixShadow)">
    <rect width="405" height="112" rx="8" fill="url(#cardGrad)" stroke="url(#borderViolet)" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 397 0 Q 405 0 405 8 L 405 28 L 0 28 Z" fill="#17142B"/>
    <text x="14" y="18" fill="#F472B6" font-size="9.5" class="mono" font-weight="bold">[05] PERSISTENCE &amp; DATABASE ENGINES</text>
    <text x="315" y="18" fill="#94A3B8" font-size="8.5" class="mono">POLYGLOT STORE</text>

    <!-- Pills -->
    <g transform="translate(14, 38)">
      <!-- Firestore -->
      <rect x="0" y="0" width="85" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="10" cy="14" r="2.5" fill="#F59E0B"/>
      <text x="20" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Firestore</text>

      <!-- DynamoDB -->
      <rect x="95" y="0" width="95" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="105" cy="14" r="2.5" fill="#38BDF8"/>
      <text x="115" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">DynamoDB</text>

      <!-- Relational SQL -->
      <rect x="200" y="0" width="115" height="28" rx="5" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="210" cy="14" r="2.5" fill="#A855F7"/>
      <text x="220" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Relational SQL</text>
    </g>

    <text x="14" y="98" fill="#64748B" font-size="8.5" class="mono">ARCHITECTURE: Real-time NoSQL synchronization + Structured relational schemas</text>
  </g>

  <!-- ==================== CLUSTER 06: AI, ML & PREDICTIVE ANALYTICS ==================== -->
  <g transform="translate(465, 330)" filter="url(#matrixShadow)">
    <rect width="405" height="112" rx="8" fill="url(#cardGrad)" stroke="url(#borderCyan)" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 397 0 Q 405 0 405 8 L 405 28 L 0 28 Z" fill="#111B29"/>
    <text x="14" y="18" fill="#38BDF8" font-size="9.5" class="mono" font-weight="bold">[06] AI, NLP &amp; PREDICTIVE ANALYTICS</text>
    <text x="310" y="18" fill="#94A3B8" font-size="8.5" class="mono">INTELLIGENCE</text>

    <!-- Pills -->
    <g transform="translate(14, 38)">
      <!-- Gemini API -->
      <rect x="0" y="0" width="95" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="10" cy="14" r="2.5" fill="#38BDF8"/>
      <text x="20" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Gemini API</text>

      <!-- NLP Models -->
      <rect x="105" y="0" width="90" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="115" cy="14" r="2.5" fill="#F472B6"/>
      <text x="125" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">NLP Models</text>

      <!-- Prophet -->
      <rect x="205" y="0" width="70" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="215" cy="14" r="2.5" fill="#34D399"/>
      <text x="225" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Prophet</text>

      <!-- Pandas / NumPy -->
      <rect x="285" y="0" width="105" height="28" rx="5" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <circle cx="295" cy="14" r="2.5" fill="#FBBF24"/>
      <text x="305" y="18" fill="#FFFFFF" font-size="10" class="mono" font-weight="600">Pandas / NumPy</text>
    </g>

    <text x="14" y="98" fill="#64748B" font-size="8.5" class="mono">PIPELINES: Adaptive GenAI quizzes, time-series stock forecasting, visual analytics</text>
  </g>

  <!-- Connective lines -->
  <line x1="232" y1="192" x2="232" y2="205" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4"/>
  <line x1="232" y1="317" x2="232" y2="330" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4"/>
  <line x1="667" y1="192" x2="667" y2="205" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4"/>
  <line x1="667" y1="317" x2="667" y2="330" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4"/>

  <!-- Footer telemetry bar -->
  <g transform="translate(30, 455)" class="mono" font-size="9" fill="#64748B">
    <text x="0" y="12">STATUS // ALL MODULES COMPILED &amp; VERIFIED</text>
    <text x="560" y="12" fill="#94A3B8">DEVELOPER_ID: samanthathippani // TKRCET_IT</text>
  </g>
</svg>

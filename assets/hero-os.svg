<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#090912"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowViolet" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07070B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07070B" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassmorphic Gradients -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181829" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0E0E18" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F5F3FF"/>
      <stop offset="75%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="subtextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Filter for subtle drop-shadow and glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Pattern for 3D Cyber Perspective Grid -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2E1A47" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scanBeam { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.35; } 80% { opacity: 0.35; } 100% { transform: translateY(450px); opacity: 0; } }
      @keyframes pulseLight { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      .blinking-cursor { animation: blink 1.05s infinite ease-in-out; }
      .scan-line { animation: scanBeam 8s linear infinite; }
      .pulsing-node { animation: pulseLight 3s ease-in-out infinite; transform-origin: center; }
      .floating-card { animation: floatSlow 5s ease-in-out infinite; }
      .mono-text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="900" height="450" fill="url(#bgGrad)"/>

  <!-- Cybernetic Perspective Grid -->
  <g opacity="0.65">
    <rect width="900" height="450" fill="url(#cyberGrid)"/>
    <!-- Horizon Glow -->
    <rect width="900" height="450" fill="url(#glowViolet)"/>
    <rect width="900" height="450" fill="url(#glowCyan)"/>
  </g>

  <!-- Animated Scanning Beam -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="url(#subtextGrad)" stroke-width="1.5" class="scan-line" opacity="0.3"/>

  <!-- Orbital Geometric Background Lines & Nodes -->
  <g stroke="#8B5CF6" stroke-opacity="0.25" stroke-dasharray="4 6" fill="none">
    <circle cx="450" cy="225" r="210" stroke-width="0.8"/>
    <circle cx="450" cy="225" r="160" stroke-width="0.6"/>
    <ellipse cx="450" cy="225" rx="380" ry="170" stroke-width="0.5"/>
  </g>
  <!-- Orbiting Nodes -->
  <circle cx="240" cy="150" r="3.5" fill="#38BDF8" class="pulsing-node"/>
  <circle cx="660" cy="300" r="3.5" fill="#F472B6" class="pulsing-node"/>
  <circle cx="450" cy="15" r="3" fill="#8B5CF6" class="pulsing-node"/>
  <line x1="240" y1="150" x2="275" y2="175" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="660" y1="300" x2="625" y2="280" stroke="#F472B6" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- ==================== LEFT FLOATING HUD CARD ==================== -->
  <g class="floating-card" transform="translate(32, 85)" filter="url(#cardShadow)">
    <rect width="180" height="275" rx="10" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <!-- Card Header -->
    <rect width="180" height="28" rx="10" fill="#131322" fill-opacity="0.8"/>
    <circle cx="16" cy="14" r="3.5" fill="#10B981" class="pulsing-node"/>
    <text x="28" y="18" fill="#94A3B8" font-size="10" class="mono-text" font-weight="600" letter-spacing="1">SYSTEM TELEMETRY</text>
    
    <!-- Status Metrics -->
    <g class="mono-text" font-size="9.5" fill="#E2E8F0">
      <text x="14" y="52" fill="#94A3B8">CORE_OS</text>
      <text x="110" y="52" fill="#34D399" font-weight="bold">ONLINE</text>

      <text x="14" y="74" fill="#94A3B8">UPTIME</text>
      <text x="110" y="74" fill="#F472B6">99.98%</text>

      <text x="14" y="96" fill="#94A3B8">GIT_FLOW</text>
      <text x="110" y="96" fill="#38BDF8">SYNCED</text>

      <text x="14" y="118" fill="#94A3B8">BUILD_CI</text>
      <text x="110" y="118" fill="#34D399">PASSING</text>
      
      <!-- Divider -->
      <line x1="14" y1="130" x2="166" y2="130" stroke="#8B5CF6" stroke-opacity="0.3"/>

      <text x="14" y="148" fill="#A78BFA" font-weight="bold">STACK FOCUS</text>
      <text x="14" y="166" fill="#CBD5E1">▸ React.js &amp; PWA</text>
      <text x="14" y="182" fill="#CBD5E1">▸ Spring Boot &amp; Py</text>
      <text x="14" y="198" fill="#CBD5E1">▸ NLP &amp; Gemini API</text>
      <text x="14" y="214" fill="#CBD5E1">▸ AWS &amp; GCP Cloud</text>

      <!-- Mini Sparkline indicator -->
      <path d="M 14 245 L 35 240 L 55 248 L 75 235 L 95 242 L 115 230 L 135 238 L 155 228 L 166 232" fill="none" stroke="#D946EF" stroke-width="1.5"/>
      <circle cx="166" cy="232" r="2.5" fill="#38BDF8"/>
      <text x="14" y="262" fill="#64748B" font-size="8.5">METRIC // LATENCY 12ms</text>
    </g>
  </g>

  <!-- ==================== RIGHT FLOATING HUD CARD ==================== -->
  <g class="floating-card" transform="translate(688, 85)" filter="url(#cardShadow)">
    <rect width="180" height="275" rx="10" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <!-- Card Header -->
    <rect width="180" height="28" rx="10" fill="#131322" fill-opacity="0.8"/>
    <circle cx="16" cy="14" r="3.5" fill="#38BDF8" class="pulsing-node"/>
    <text x="28" y="18" fill="#94A3B8" font-size="10" class="mono-text" font-weight="600" letter-spacing="1">MISSION CONTROL</text>
    
    <!-- Mission Mode -->
    <g class="mono-text" font-size="9.5" fill="#E2E8F0">
      <text x="14" y="52" fill="#94A3B8">MODE</text>
      <text x="85" y="52" fill="#F472B6" font-weight="bold">AUTONOMOUS</text>

      <text x="14" y="74" fill="#94A3B8">TARGET</text>
      <text x="85" y="74" fill="#A78BFA">INNOVATION</text>

      <text x="14" y="96" fill="#94A3B8">LOCATION</text>
      <text x="85" y="96" fill="#38BDF8">HYDERABAD, IN</text>

      <!-- Divider -->
      <line x1="14" y1="108" x2="166" y2="108" stroke="#8B5CF6" stroke-opacity="0.3"/>

      <text x="14" y="126" fill="#A78BFA" font-weight="bold">ACTIVE INITIATIVES</text>
      <text x="14" y="146" fill="#34D399">◉ 01 BUILD</text>
      <text x="26" y="160" fill="#94A3B8" font-size="8.5">Scalable Web &amp; AI</text>

      <text x="14" y="180" fill="#38BDF8">◉ 02 LEARN</text>
      <text x="26" y="194" fill="#94A3B8" font-size="8.5">IIT M / K Adv Data</text>

      <text x="14" y="214" fill="#F472B6">◉ 03 SHIP</text>
      <text x="26" y="228" fill="#94A3B8" font-size="8.5">EduTape &amp; Prophet</text>

      <!-- Status tag -->
      <rect x="14" y="244" width="152" height="19" rx="4" fill="#1F1A3A"/>
      <text x="24" y="257" fill="#DDD6FE" font-size="8.5" font-weight="600">STATUS: OPEN TO ROLES</text>
    </g>
  </g>

  <!-- ==================== CENTRAL 3D COMMAND DECK ==================== -->
  <g transform="translate(232, 45)" filter="url(#cardShadow)">
    <!-- Main Terminal Body -->
    <rect width="436" height="360" rx="14" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Terminal Window Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 422 0 Q 436 0 436 14 L 436 38 L 0 38 Z" fill="#121220" fill-opacity="0.95"/>
    <line x1="0" y1="38" x2="436" y2="38" stroke="#8B5CF6" stroke-opacity="0.3"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="5" fill="#EF4444" opacity="0.85"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="52" cy="19" r="5" fill="#10B981" opacity="0.85"/>

    <!-- Terminal Title -->
    <text x="150" y="23" fill="#94A3B8" font-size="10.5" class="mono-text" font-weight="600" letter-spacing="1">DEV_OS // NEON_NOIR_v4.2</text>
    <rect x="338" y="10" width="86" height="18" rx="4" fill="#241738"/>
    <text x="345" y="22" fill="#C084FC" font-size="8.5" class="mono-text" font-weight="bold">TLS 1.3 SECURE</text>

    <!-- Holographic Identification Tag -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="170" height="20" rx="4" fill="#1E1638" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="10" cy="10" r="3" fill="#38BDF8" class="pulsing-node"/>
      <text x="20" y="14" fill="#DDD6FE" font-size="9" class="mono-text" font-weight="bold" letter-spacing="1">IDENTITY VERIFIED</text>
    </g>

    <!-- Developer Main Identity -->
    <text x="20" y="108" fill="url(#textGrad)" font-size="28" class="sans-text" font-weight="900" letter-spacing="2" filter="url(#softGlow)">SAMANTHA THIPPANI</text>

    <!-- Subtitle Roles -->
    <g class="mono-text" font-size="11" font-weight="600">
      <text x="22" y="132" fill="#F472B6">SOFTWARE ENGINEER</text>
      <text x="175" y="132" fill="#64748B">•</text>
      <text x="188" y="132" fill="#DDD6FE">AI BUILDER</text>
      <text x="272" y="132" fill="#64748B">•</text>
      <text x="285" y="132" fill="#38BDF8">FULL STACK</text>
    </g>

    <!-- Separator bar with neon gradient -->
    <rect x="20" y="146" width="396" height="1.5" fill="url(#borderGrad)"/>

    <!-- Interactive Hacker Terminal Screen -->
    <rect x="18" y="160" width="400" height="185" rx="8" fill="#0A0A12" stroke="#251B38" stroke-width="1"/>
    
    <!-- Terminal Lines -->
    <g class="mono-text" font-size="10.5">
      <!-- Line 1: Command -->
      <text x="32" y="185" fill="#38BDF8" font-weight="bold">developer@github:~$</text>
      <text x="175" y="185" fill="#F1F5F9">sys.initialize --mode=autonomous</text>

      <!-- Line 2: Kernel boot -->
      <text x="32" y="207" fill="#64748B">[boot]</text>
      <text x="75" y="207" fill="#C084FC">Loading profile modules &amp; runtime...</text>
      <text x="330" y="207" fill="#34D399" font-weight="bold">[OK]</text>

      <!-- Line 3: Tech Engine -->
      <text x="32" y="229" fill="#64748B">[core]</text>
      <text x="75" y="229" fill="#E2E8F0">Stack: React • Angular • Spring Boot • Python</text>

      <!-- Line 4: AI Engine -->
      <text x="32" y="251" fill="#64748B">[ml/ai]</text>
      <text x="75" y="251" fill="#F472B6">APIs: Gemini • NLP Models • Prophet Engine</text>

      <!-- Line 5: Cloud Status -->
      <text x="32" y="273" fill="#64748B">[cloud]</text>
      <text x="75" y="273" fill="#38BDF8">Infrastructure: AWS • GCP • DynamoDB • Firestore</text>

      <!-- Line 6: Active Command & Cursor -->
      <text x="32" y="300" fill="#38BDF8" font-weight="bold">developer@github:~$</text>
      <text x="175" y="300" fill="#F8FAFC">status --verbose</text>

      <!-- Output Line with Blinking Cursor -->
      <text x="32" y="323" fill="#34D399" font-weight="bold">&gt; SYSTEM OPERATIONAL // READY FOR PRODUCTION</text>
      <rect x="360" y="312" width="8" height="13" fill="#F472B6" class="blinking-cursor"/>
    </g>
  </g>

  <!-- High-tech corner bracket accents -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 888 24 L 888 12 L 876 12" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 12 426 L 12 438 L 24 438" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 888 426 L 888 438 L 876 438" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D1C"/>
      <stop offset="60%" stop-color="#141328"/>
      <stop offset="100%" stop-color="#0A0914"/>
    </linearGradient>

    <linearGradient id="borderGradFlagship" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1938"/>
      <stop offset="100%" stop-color="#131024"/>
    </linearGradient>

    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulseDot { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      .pulsing { animation: pulseDot 2.5s infinite; }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect x="2" y="2" width="896" height="336" rx="12" fill="url(#cardBg)" stroke="url(#borderGradFlagship)" stroke-width="1.6"/>

  <!-- Card Top Navigation Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 886 2 Q 898 2 898 14 L 898 38 L 2 38 Z" fill="#121024" fill-opacity="0.9"/>
  <line x1="2" y1="38" x2="898" y2="38" stroke="#8B5CF6" stroke-opacity="0.3"/>

  <!-- Window controls -->
  <circle cx="22" cy="20" r="4.5" fill="#EF4444"/>
  <circle cx="38" cy="20" r="4.5" fill="#F59E0B"/>
  <circle cx="54" cy="20" r="4.5" fill="#10B981"/>

  <text x="75" y="24" fill="#DDD6FE" font-size="10.5" class="mono" font-weight="bold">REPOSITORY // samanthathippani/edutape-pwa</text>

  <!-- Tag Pills on Right -->
  <g transform="translate(620, 10)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="#2E1045"/>
    <text x="10" y="14" fill="#F472B6" font-size="9" class="mono" font-weight="bold">FLAGSHIP</text>

    <rect x="88" y="0" width="85" height="20" rx="4" fill="#162540"/>
    <circle cx="98" cy="10" r="3" fill="#38BDF8" class="pulsing"/>
    <text x="106" y="14" fill="#38BDF8" font-size="9" class="mono" font-weight="bold">PWA LIVE</text>

    <rect x="180" y="0" width="90" height="20" rx="4" fill="#182E25"/>
    <text x="188" y="14" fill="#34D399" font-size="9" class="mono" font-weight="bold">SPARKEXPO'26</text>
  </g>

  <!-- Main Content Body -->
  <g transform="translate(28, 55)">
    <!-- Category & Deployment Stamp -->
    <text x="0" y="16" fill="#F472B6" font-size="10" class="mono" font-weight="bold" letter-spacing="1.5">● 01 // AUTONOMOUS E-LEARNING SYSTEM</text>
    
    <!-- Title -->
    <text x="0" y="46" fill="url(#titleGrad)" font-size="24" class="sans" font-weight="900" letter-spacing="1">EduTape — AI-Powered Gamified Learning Platform</text>
    
    <!-- One-line Summary -->
    <text x="0" y="70" fill="#94A3B8" font-size="11.5" class="sans">
      Full-stack Progressive Web App (PWA) engineering adaptive education pathways with Gemini API, NLP assessment models, and scalable real-time cloud data pipelines.
    </text>

    <!-- 3 Architectural Pillar Blocks -->
    <g transform="translate(0, 88)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="270" height="88" rx="6" fill="#121124" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="20" fill="#38BDF8" font-size="9.5" class="mono" font-weight="bold">01 // ADAPTIVE AI CORE</text>
      <text x="12" y="38" fill="#CBD5E1" font-size="9.5" class="sans">Integrated Gemini API &amp; NLP</text>
      <text x="12" y="54" fill="#CBD5E1" font-size="9.5" class="sans">Generates dynamic quizzes and</text>
      <text x="12" y="70" fill="#CBD5E1" font-size="9.5" class="sans">personalized learning trajectories.</text>

      <!-- Pillar 2 -->
      <rect x="285" y="0" width="270" height="88" rx="6" fill="#121124" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="297" y="20" fill="#F472B6" font-size="9.5" class="mono" font-weight="bold">02 // CLOUD &amp; DATA ENGINE</text>
      <text x="297" y="38" fill="#CBD5E1" font-size="9.5" class="sans">Hybrid AWS &amp; GCP architecture</text>
      <text x="297" y="54" fill="#CBD5E1" font-size="9.5" class="sans">with Firestore &amp; DynamoDB for</text>
      <text x="297" y="70" fill="#CBD5E1" font-size="9.5" class="sans">instant multi-device progress sync.</text>

      <!-- Pillar 3 -->
      <rect x="570" y="0" width="270" height="88" rx="6" fill="#121124" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="582" y="20" fill="#34D399" font-size="9.5" class="mono" font-weight="bold">03 // RETENTION &amp; GAMIFICATION</text>
      <text x="582" y="38" fill="#CBD5E1" font-size="9.5" class="sans">XP engine, streak counters,</text>
      <text x="582" y="54" fill="#CBD5E1" font-size="9.5" class="sans">achievement badges, and offline</text>
      <text x="582" y="70" fill="#CBD5E1" font-size="9.5" class="sans">service-worker caching.</text>
    </g>

    <!-- Tech Stack Pills Row -->
    <g transform="translate(0, 195)" class="mono" font-size="9.5">
      <rect x="0" y="0" width="80" height="25" rx="4" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="14" y="16" fill="#DDD6FE">React.js</text>

      <rect x="88" y="0" width="105" height="25" rx="4" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="98" y="16" fill="#DDD6FE">Python / Flask</text>

      <rect x="201" y="0" width="95" height="25" rx="4" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <text x="211" y="16" fill="#38BDF8">Gemini API</text>

      <rect x="304" y="0" width="95" height="25" rx="4" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="0.8"/>
      <text x="314" y="16" fill="#38BDF8">NLP Models</text>

      <rect x="407" y="0" width="100" height="25" rx="4" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="417" y="16" fill="#DDD6FE">AWS &amp; GCP</text>

      <rect x="515" y="0" width="90" height="25" rx="4" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="525" y="16" fill="#DDD6FE">Firestore</text>

      <rect x="613" y="0" width="95" height="25" rx="4" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="623" y="16" fill="#DDD6FE">DynamoDB</text>

      <rect x="716" y="0" width="124" height="25" rx="4" fill="url(#pillGrad)" stroke="#D946EF" stroke-width="0.8"/>
      <text x="726" y="16" fill="#F472B6">Progressive App</text>
    </g>

    <!-- Bottom Telemetry & Status Bar -->
    <g transform="translate(0, 240)" class="mono" font-size="10">
      <line x1="0" y1="0" x2="840" y2="0" stroke="#8B5CF6" stroke-opacity="0.25"/>
      <circle cx="6" cy="18" r="3.5" fill="#10B981" class="pulsing"/>
      <text x="18" y="22" fill="#34D399" font-weight="bold">SYSTEM STATUS: VERIFIED &amp; DEMONSTRATED AT SPARKEXPO-26</text>
      <text x="630" y="22" fill="#94A3B8">BUILD // v2.4.0-stable</text>
    </g>
  </g>
</svg>
